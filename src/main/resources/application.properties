spring.application.name=notepad

# --- Database connection ---
# DB_HOST defaults to 'localhost' for when you still run the app directly
# from IntelliJ (outside Docker) ? inside docker-compose, this will be
# overridden to the MySQL service's container name instead.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/notepad_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Server ---
server.port=8080
server.servlet.session.timeout=30m

# --- Email configuration (Gmail SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL used in emails ? will be overridden with the real deployed
# URL once we reach the AWS step.
app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.thymeleaf.cache=false
