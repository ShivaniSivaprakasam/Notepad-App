<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>To Do - Notepad</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="page-container">
            <div class="page-header-row"><h1>To Do</h1></div>

            <p th:if="${todoError}" th:text="${todoError}" class="error-message"></p>

            <form th:action="@{/todo}" th:object="${newTodo}" method="post" class="add-todo-form">
                <input type="hidden" name="returnTo" value="todos">
                <select th:field="*{noteId}">
                    <option value="">-- No note (standalone task) --</option>
                    <option th:each="note : ${notes}" th:value="${note.id}" th:text="${note.title}"></option>
                </select>
                <input type="text" th:field="*{task}" placeholder="Task description..." required>
                <button type="submit" class="btn">+ Add Todo</button>
            </form>

            <p th:if="${#lists.isEmpty(todos)}">No tasks yet. Add one above.</p>

            <div class="note-card" th:each="todo : ${todos}">
                <div class="todo-row">
                    <form th:action="@{/todo/update}" method="post" style="display:flex; align-items:center; gap:12px; flex:1; margin:0;">
                        <input type="hidden" name="returnTo" value="todos">
                        <input type="hidden" name="todoId" th:value="${todo.id}">
                        <input type="hidden" th:if="${todo.note != null}" name="noteId" th:value="${todo.note.id}">
                        <input type="checkbox" name="completed" value="true" class="todo-checkbox" th:checked="${todo.completed}" onchange="this.form.submit()">
                        <span class="todo-text" th:classappend="${todo.completed} ? 'completed' : ''" th:text="${todo.task}"></span>
                    </form>
                    <a th:if="${todo.note != null}"
                       th:href="@{'/todo/delete/' + ${todo.id} + '?returnTo=todos&noteId=' + ${todo.note.id}}"
                       class="todo-delete-icon" title="Delete task" onclick="return confirm('Delete this task?');">✕</a>
                    <a th:if="${todo.note == null}"
                       th:href="@{'/todo/delete/' + ${todo.id} + '?returnTo=todos'}"
                       class="todo-delete-icon" title="Delete task" onclick="return confirm('Delete this task?');">✕</a>
                </div>
                <p class="note-meta" th:if="${todo.note != null}">
                    From note: <a th:href="@{'/notes/' + ${todo.note.id}}" th:text="${todo.note.title}"></a>
                </p>
                <p class="note-meta" th:if="${todo.note == null}">Standalone task</p>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
