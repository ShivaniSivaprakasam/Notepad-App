<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categories - Notepad</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="page-container">
            <h1>Categories</h1>
            <p class="note-meta">These default categories are available on every account and help you organize your notes when creating them.</p>

            <div class="category-grid">
                <div class="category-tile" th:each="cat : ${categories}">
                    <span class="category-icon" th:text="${#strings.substring(cat.name, 0, 1)}"></span>
                    <span class="category-name" th:text="${cat.name}"></span>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(categories)}">No categories found.</p>
        </div>
    </div>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
