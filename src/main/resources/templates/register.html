<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Notepad</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-container">
    <h1>Create an Account</h1>
    <p th:if="${registrationError}" th:text="${registrationError}" class="error-message"></p>
    <p th:if="${passwordError}" th:text="${passwordError}" class="error-message"></p>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="input-icon-group"><span class="input-icon">👤</span>
            <input type="text" id="username" th:field="*{username}" placeholder="Username"></div>
        <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error-message"></p>

        <div class="input-icon-group"><span class="input-icon">✉️</span>
            <input type="email" id="email" th:field="*{email}" placeholder="Email"></div>
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></p>

        <div class="input-icon-group"><span class="input-icon">🔒</span>
            <input type="password" id="password" th:field="*{password}" placeholder="Password"></div>
        <small style="color:var(--text-muted);">At least 8 characters, with an uppercase letter, a lowercase letter, and a number.</small>
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"></p>

        <div class="input-icon-group"><span class="input-icon">🔒</span>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Confirm Password"></div>

        <button type="submit" class="btn btn-full" style="margin-top:16px;">Register</button>
    </form>
    <p class="register-hint">Already have an account? <a th:href="@{/login}">Login here</a></p>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
