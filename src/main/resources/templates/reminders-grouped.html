<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reminders - Notepad</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="page-container">
            <h1>Reminders</h1>
            <a th:href="@{/reminders/new}" class="btn" style="margin-bottom:16px; display:inline-block;">+ New Reminder</a>

            <h3 class="tag-group-heading">Daily</h3>
            <p th:if="${#lists.isEmpty(daily)}">No daily reminders.</p>
            <div class="note-card" th:each="r : ${daily}">
                <strong th:text="${r.title}"></strong>
                <p class="note-meta" th:text="${#temporals.format(r.date, 'dd MMM yyyy')} + ' at ' + ${r.time}"></p>
                <div class="btn-row">
                    <a th:href="@{'/reminders/edit/' + ${r.id}}" class="btn btn-sm">Edit</a>
                    <a th:href="@{'/reminders/delete/' + ${r.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this reminder?');">Delete</a>
                </div>
            </div>

            <h3 class="tag-group-heading">Weekly</h3>
            <p th:if="${#lists.isEmpty(weekly)}">No weekly reminders.</p>
            <div class="note-card" th:each="r : ${weekly}">
                <strong th:text="${r.title}"></strong>
                <p class="note-meta" th:text="${#temporals.format(r.date, 'dd MMM yyyy')} + ' at ' + ${r.time}"></p>
                <div class="btn-row">
                    <a th:href="@{'/reminders/edit/' + ${r.id}}" class="btn btn-sm">Edit</a>
                    <a th:href="@{'/reminders/delete/' + ${r.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this reminder?');">Delete</a>
                </div>
            </div>

            <h3 class="tag-group-heading">Monthly</h3>
            <p th:if="${#lists.isEmpty(monthly)}">No monthly reminders.</p>
            <div class="note-card" th:each="r : ${monthly}">
                <strong th:text="${r.title}"></strong>
                <p class="note-meta" th:text="${#temporals.format(r.date, 'dd MMM yyyy')} + ' at ' + ${r.time}"></p>
                <div class="btn-row">
                    <a th:href="@{'/reminders/edit/' + ${r.id}}" class="btn btn-sm">Edit</a>
                    <a th:href="@{'/reminders/delete/' + ${r.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this reminder?');">Delete</a>
                </div>
            </div>

            <h3 class="tag-group-heading">One-time / Yearly</h3>
            <p th:if="${#lists.isEmpty(oneTime)}">None.</p>
            <div class="note-card" th:each="r : ${oneTime}">
                <strong th:text="${r.title}"></strong>
                <p class="note-meta" th:text="${#temporals.format(r.date, 'dd MMM yyyy')} + ' at ' + ${r.time}"></p>
                <div class="btn-row">
                    <a th:href="@{'/reminders/edit/' + ${r.id}}" class="btn btn-sm">Edit</a>
                    <a th:href="@{'/reminders/delete/' + ${r.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this reminder?');">Delete</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
