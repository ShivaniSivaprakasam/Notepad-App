<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="(${errorTitle} ?: 'Error') + ' - Notepad'">Error</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-container">
    <h1 th:text="(${statusCode} ?: '500') + ' — ' + (${errorTitle} ?: 'Something Went Wrong')"></h1>
    <p th:text="${errorMessage} ?: 'An unexpected error occurred. Please try again.'"></p>
    <a href="/dashboard" class="btn">Back to Home</a>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
