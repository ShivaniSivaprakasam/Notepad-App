<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${note.title}">View Note</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="page-container">
            <p th:if="${error}" th:text="${error}" class="error-message"></p>
            <h1 th:text="${note.title}"></h1>
            <p class="note-meta">
                <span th:if="${note.category}" th:text="'Category: ' + ${note.category.name}"></span>
                &nbsp;|&nbsp; Last updated: <span th:text="${#temporals.format(note.updatedAt, 'dd MMM yyyy, HH:mm')}"></span>
            </p>

            <div th:if="${note.tags != null and not #lists.isEmpty(note.tags)}" style="margin-bottom:12px;">
                <span th:each="tag : ${note.tags}" th:text="${tag.name}" class="tag-chip"></span>
            </div>

            <div th:utext="${note.content}" style="background:#ffffff; color:#1a1a1a; padding:16px; border-radius:6px;"></div>

            <div th:if="${note.passwordProtected}" style="margin:10px 0; font-weight:bold;">🔒 Protected</div>

            <div class="btn-row" style="margin-top:16px;">
                <a th:if="${canEdit}" th:href="@{'/notes/edit/' + ${note.id}}" class="btn">Edit</a>
                <a th:if="${isOwner}" th:href="@{'/notes/' + ${note.id} + '/share'}" class="btn">Share</a>
                <a th:if="${isOwner and !note.passwordProtected}" th:href="@{'/notes/protect/' + ${note.id}}" class="btn">🔒 Protect</a>
                <form th:if="${isOwner and note.passwordProtected}" th:action="@{'/notes/unprotect/' + ${note.id}}" method="post" style="display:inline;">
                    <input type="password" name="password" placeholder="Current password" required style="width:auto; display:inline-block; padding:8px; margin-top:0;">
                    <button type="submit" class="btn btn-danger">Remove Protection</button>
                </form>
                <a th:href="@{/notes}" class="btn">Back to Notes</a>
            </div>

            <hr style="border-color: var(--border-color); margin:24px 0;">
            <h3>To-Do Items</h3>

            <div th:each="todo : ${note.todos}" class="todo-row">
                <span th:unless="${isOwner}" style="display:flex; align-items:center; gap:12px; width:100%;">
                    <input type="checkbox" class="todo-checkbox" disabled th:checked="${todo.completed}">
                    <span class="todo-text" th:classappend="${todo.completed} ? 'completed' : ''" th:text="${todo.task}"></span>
                </span>
                <form th:if="${isOwner}" th:action="@{/todo/update}" method="post" style="display:flex; align-items:center; gap:12px; flex:1; margin:0;">
                    <input type="hidden" name="noteId" th:value="${note.id}">
                    <input type="hidden" name="todoId" th:value="${todo.id}">
                    <input type="checkbox" name="completed" value="true" class="todo-checkbox" th:checked="${todo.completed}" onchange="this.form.submit()">
                    <span class="todo-text" th:classappend="${todo.completed} ? 'completed' : ''" th:text="${todo.task}"></span>
                </form>
                <a th:if="${isOwner}" th:href="@{'/todo/delete/' + ${todo.id} + '?noteId=' + ${note.id}}"
                   class="todo-delete-icon" title="Delete task" onclick="return confirm('Delete this task?');">✕</a>
            </div>
            <p th:if="${note.todos == null or #lists.isEmpty(note.todos)}">No tasks yet.</p>

            <p th:if="${todoError}" th:text="${todoError}" class="error-message"></p>
            <form th:if="${isOwner}" th:action="@{/todo}" th:object="${newTodo}" method="post" class="add-todo-form" style="margin-top:12px;">
                <input type="hidden" name="noteId" th:value="${note.id}">
                <input type="text" th:field="*{task}" placeholder="Add a task...">
                <button type="submit" class="btn">Add Task</button>
            </form>
        </div>
    </div>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
