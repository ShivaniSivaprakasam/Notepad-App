<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reminders - Notepad</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <div class="page-container">
            <h1 th:text="'Reminders for ' + ${#temporals.format(date, 'dd MMM yyyy')}"></h1>
            <a th:href="@{/reminders/new(date=${date})}" class="btn" style="margin-bottom:16px; display:inline-block;">+ New Reminder</a>
            <p th:if="${#lists.isEmpty(reminders)}">No reminders on this day.</p>
            <div class="note-card" th:each="reminder : ${reminders}">
                <h3 th:text="${reminder.title}"></h3>
                <p class="note-meta" th:text="${reminder.time}"></p>
                <p th:if="${reminder.description}" th:text="${reminder.description}"></p>
                <div class="btn-row">
                    <a th:href="@{'/reminders/edit/' + ${reminder.id}}" class="btn btn-sm">Edit</a>
                    <a th:href="@{'/reminders/delete/' + ${reminder.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this reminder?');">Delete</a>
                </div>
            </div>
            <a th:href="@{/reminders/calendar}" class="btn" style="margin-top:16px; display:inline-block;">Back to Calendar</a>
        </div>
    </div>
</div>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
