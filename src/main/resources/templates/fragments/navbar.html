<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar">
    <a th:href="@{/dashboard}" class="navbar-brand">Notepad</a>
    <div class="navbar-links">
        <a th:href="@{/notes}">My Notes</a>
        <a th:href="@{/notes/favorites}">Favorites</a>
        <a th:href="@{/notes/archived}">Archive</a>
        <a th:href="@{/notes/trash}">Trash</a>
        <a th:href="@{/categories}">Categories</a>
        <a th:href="@{/sticky}">Sticky Notes</a>
        <a th:href="@{/reminders/calendar}">Calendar</a>
        <a th:href="@{/notes/shared-with-me}">Shared with Me</a>
    </div>
    <div class="navbar-logout">
        <!--
            Dark mode toggle button. Text/icon is updated by JS based
            on the current theme state (see theme.js).
        -->
        <button type="button" id="themeToggleBtn" class="theme-toggle-btn">🌙 Dark Mode</button>
        <form th:action="@{/logout}" method="post" style="margin:0;">
            <button type="submit">Logout</button>
        </form>
    </div>
</nav>
</body>
</html>
