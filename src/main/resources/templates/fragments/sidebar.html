<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="sidebar" class="sidebar">
    <div class="sidebar-brand">📝 Notepad</div>
    <div class="sidebar-links">
        <a th:href="@{/dashboard}">🏠 Home</a>
        <a th:href="@{/notes}">📄 My Notes</a>
        <a th:href="@{/notes/favorites}">⭐ Favorites</a>
        <a th:href="@{/todos}">✅ To Do</a>
        <a th:href="@{/categories}">🏷️ Category</a>
        <a th:href="@{/notes/archived}">📦 Archive</a>
        <a th:href="@{/notes/trash}">🗑️ Trash</a>
        <a th:href="@{/reminders/calendar}">📅 Calendar</a>
        <a th:href="@{/reminders/grouped}">🔔 Reminders</a>
        <a th:href="@{/notes/shared}">🤝 Shared Notes</a>
        <a th:href="@{/notifications}">📬 Notifications</a>
        <a th:href="@{/profile}">👤 Profile</a>
    </div>
    <div class="sidebar-footer">
        <button type="button" id="themeToggleBtn" class="theme-toggle-btn">🌙 Dark Mode</button>
        <form th:action="@{/logout}" method="post" style="margin:0;">
            <button type="submit" class="btn btn-full">Logout</button>
        </form>
    </div>
</nav>
</body>
</html>
